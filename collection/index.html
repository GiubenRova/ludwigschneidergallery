<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="../" name="site-root"/>
  <meta content="#F8F5E8" name="theme-color"/>
  <title>
   Collection — Ludwig Schneider Gallery
  </title>
  <link href="../assets/css/style.css" rel="stylesheet"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
 </head>
 <body>
  <a class="skip" href="#main">
   Skip to content
  </a>
  <header class="site-header">
   <div class="wrap">
    <a aria-label="Ludwig Schneider Gallery homepage" class="logo" href="../">
     <img alt="Ludwig Schneider Gallery" src="../assets/images/logo-horizontal.png"/>
    </a>
    <nav aria-label="Main navigation" class="nav">
     <a href="../">
      Home
     </a>
     <a href="../artists/">
      Artists
     </a>
     <a aria-current="page" href="../collection/">
      Collection
     </a>
     <a href="../about/">
      About
     </a>
    </nav>
   </div>
  </header>
  <main class="wrap" id="main">
   <section class="intro">
    <span class="eyebrow">
     Ludwig Schneider Gallery / Collection
    </span>
    <h1>
     Artworks.
    </h1>
    <p class="lead">
     Select an artwork to view its images and catalogue description.
    </p>
   </section>
   <section class="section">
    <div class="grid" id="collection-grid">
    </div>
   </section>
  </main>
  <div class="overlay" hidden="" id="artwork-overlay">
   <section aria-labelledby="work-title" aria-modal="true" class="dialog" role="dialog">
    <div class="dialog-bar">
     <span class="eyebrow">
      Ludwig Schneider Gallery / Collection
     </span>
     <button aria-label="Close artwork" class="plain-button close-button" id="close-work">
      ×
     </button>
    </div>
    <div class="dialog-body">
     <div class="dialog-gallery">
      <div class="gallery-stage">
       <button aria-label="Previous image" class="arrow" id="previous-slide">
        ‹
       </button>
       <div class="placeholder" id="slide-stage">
       </div>
       <button aria-label="Next image" class="arrow" id="next-slide">
        ›
       </button>
      </div>
      <div class="thumb-strip" id="slide-thumbs">
      </div>
     </div>
     <div class="dialog-info">
      <span class="eyebrow">
       Artwork record
      </span>
      <h2 id="work-title">
      </h2>
      <dl class="facts" id="work-facts">
      </dl>
      <div class="description" id="work-description">
      </div>
      <div class="dialog-actions">
       <button class="share-button" id="share-work">
        ↗ Share artwork
       </button>
      </div>
      <div class="pager">
       <button class="plain-button" id="previous-work">
        ← Previous artwork
       </button>
       <button class="plain-button" id="next-work">
        Next artwork →
       </button>
      </div>
     </div>
    </div>
   </section>
  </div>
  <footer class="site-footer">
   <div class="wrap">
    <span>
     © Ludwig Schneider Gallery
    </span>
    <span>
     <a href="../about/">
      About the Gallery
     </a>
    </span>
   </div>
  </footer>
  <script defer="" src="../assets/js/site.js">
  </script>
 </body>
</html>
